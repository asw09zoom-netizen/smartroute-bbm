name: Bangun jaringan jalan OSM (legal truk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/fetch_osm.py"
      - "smartroute/roadnet.py"
      - "data/armada.csv"
      - "data/spbu.csv"
      - "data/osm_jalan.csv"
      - "data/aturan_kelas_jalan.csv"
      - ".github/workflows/roadnet.yml"

permissions:
  contents: write

concurrency:
  group: roadnet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy
      - name: Unduh OSM (sekali; hapus data/osm/roads.json.gz untuk unduh ulang)
        run: |
          if [ ! -f data/osm/roads.json.gz ]; then python tools/fetch_osm.py; fi
      - name: Hitung matriks jarak & geometri per tipe truk
        run: python -m smartroute.roadnet
      - name: Simpan hasil ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm/roads.json.gz data/osm/ringkasan_ruas.csv data/jarak_jalan_osm.csv data/rute_osm_geom.json.gz
          if git diff --cached --quiet; then echo "tidak ada perubahan"; else
            git commit -m "data: jaringan jalan OSM legal-truk (otomatis)"
            git push
          fi
